<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Booking Dashboard | KAT’S GLAM STUDIO</title>
<style>
:root {
  --bg: #ffffff;
  --text: #1f2328;
  --muted: #6b7280;
  --surface: #ffffff;
  --head: #f6f7f9;
  --stripe: #f9fafb;
  --border: #d9dde3;
  --green: #2e9e5b; --green-border: #9fd5b5;
  --red: #d64545; --red-border: #eba3a3;
  --amber: #e0a21a;
  --btn-bg: #ffffff; --btn-border: #8b929c;
  --grey-btn: #59626e;
  --accent: #d87093;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --text: #eceef1; --muted: #9aa1ab;
    --surface: #1d2024; --head: #262a30; --stripe: #21252a; --border: #373c44;
    --green: #5fd391; --green-border: #2c6b47;
    --red: #f27b7b; --red-border: #7a3434;
    --amber: #f0b94a;
    --btn-bg: #1d2024; --btn-border: #6b727c;
    --grey-btn: #4b525c;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; }
.hidden { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

button { font-size: 1rem; cursor: pointer; }
.logout {
  background: var(--grey-btn); color: #fff; border: none; border-radius: 6px;
  padding: 0.6rem 1.1rem; font-size: 1.05rem;
}
.logout:hover { filter: brightness(1.1); }

/* Login */
#login { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
.login-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 2rem; width: min(100%, 380px); display: flex; flex-direction: column; gap: 1rem;
}
.login-card h1 { font-size: 1.35rem; }
.login-card p { color: var(--muted); font-size: 0.95rem; }
label { font-weight: 500; font-size: 0.9rem; display: block; margin-bottom: 0.25rem; }
input {
  width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: 6px;
  font-size: 1rem; background: var(--surface); color: var(--text);
}
.primary {
  background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 0.7rem; font-weight: 600;
}
.primary:disabled { opacity: 0.6; cursor: default; }
.error { background: #fde8e8; color: #9b1c1c; padding: 0.7rem; border-radius: 6px; font-size: 0.9rem; margin-bottom: 1rem; }

/* Dashboard */
.wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.top h1 { font-size: 1.9rem; font-weight: 600; }
.who { color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
.stat {
  background: var(--surface); border-radius: 8px; text-align: center; padding: 1rem 1rem 1.1rem;
  font-size: 1.15rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.stat b { display: block; font-size: 3rem; line-height: 1.15; }
.stat.ok { border: 1px solid var(--green-border); }
.stat.ok b { color: var(--green); }
.stat.bad { border: 1px solid var(--red-border); }
.stat.bad b { color: var(--red); }

.toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
.tab {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 20px; padding: 0.35rem 0.95rem; font-size: 0.9rem;
}
.tab[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.toolbar input { max-width: 240px; margin-left: auto; padding: 0.45rem 0.8rem; font-size: 0.9rem; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; min-width: 780px; }
th, td { text-align: left; padding: 1rem 0.9rem; border-right: 1px solid var(--border); font-size: 1.05rem; }
th:last-child, td:last-child { border-right: none; }
th { background: var(--head); font-weight: 600; border-bottom: 2px solid var(--border); }
td { border-top: 1px solid var(--border); }
tbody tr:nth-child(even) td { background: var(--stripe); }
td a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
td a:hover { color: var(--accent); }
.status-pending { color: var(--amber); }
.status-confirmed { color: var(--green); }
.status-cancelled { color: var(--red); }
.acts { display: flex; gap: 0.5rem; }
.act {
  background: var(--btn-bg); color: var(--text); border: 1px solid var(--btn-border);
  border-radius: 6px; padding: 0.45rem 0.9rem; font-size: 1.05rem;
}
.act:hover:not(:disabled) { background: var(--head); }
.act:disabled { opacity: 0.4; cursor: default; }
.empty { text-align: center; color: var(--muted); padding: 2.5rem 1rem !important; }

@media (max-width: 640px) {
  .stats { grid-template-columns: 1fr; gap: 1rem; }
  .top h1 { font-size: 1.4rem; }
  .toolbar input { max-width: none; margin-left: 0; width: 100%; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <form class="login-card" id="loginForm">
    <h1>Kat’s Glam Studio</h1>
    <p>Sign in to see your bookings.</p>
    <div id="loginError" class="error hidden" role="alert"></div>
    <div><label for="email">Email</label><input type="email" id="email" required autocomplete="username"></div>
    <div><label for="password">Password</label><input type="password" id="password" required autocomplete="current-password"></div>
    <button class="primary" type="submit" id="loginBtn">Sign in</button>
  </form>
</section>

<!-- DASHBOARD -->
<section id="app" class="hidden">
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Kat’s Glam Studio — Booking Dashboard</h1>
        <div class="who" id="who"></div>
      </div>
      <button class="logout" id="logoutBtn">Log Out</button>
    </div>

    <div class="stats">
      <div class="stat ok">Total Booked<b id="sTotal">0</b>appointments</div>
      <div class="stat bad">Cancelled<b id="sCancelled">0</b>bookings</div>
    </div>

    <div id="error" class="error hidden" role="alert"></div>

    <div class="toolbar" id="tabs">
      <button class="tab" data-f="all" aria-pressed="true">All</button>
      <button class="tab" data-f="today" aria-pressed="false">Today</button>
      <button class="tab" data-f="upcoming" aria-pressed="false">Upcoming</button>
      <button class="tab" data-f="pending" aria-pressed="false">Pending</button>
      <button class="tab" data-f="confirmed" aria-pressed="false">Confirmed</button>
      <button class="tab" data-f="cancelled" aria-pressed="false">Cancelled</button>
      <input type="search" id="search" placeholder="Search name, phone or service" aria-label="Search bookings">
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Client Name</th><th>Phone</th><th>Service</th><th>Date &amp; Time</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAGZgA13UDTCCACRtbYVDggoOmwWqpmzIg",
    authDomain: "kat-s-glam-studio.firebaseapp.com",
    databaseURL: "https://kat-s-glam-studio-default-rtdb.firebaseio.com",
    projectId: "kat-s-glam-studio",
    storageBucket: "kat-s-glam-studio.firebasestorage.app",
    messagingSenderId: "107385180943",
    appId: "1:107385180943:web:97c53e92db1d7d6ee9647a"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getDatabase(fbApp);
  const auth = getAuth(fbApp);

  const $ = (id) => document.getElementById(id);
  let bookings = [];
  let filter = 'all';
  let unsubscribe = null;

  /* ---------- Auth ---------- */
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in...';
    $('loginError').classList.add('hidden');
    try {
      await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value);
    } catch (err) {
      $('loginError').textContent = 'Could not sign in (' + (err.code || 'unknown error') + '). Check your email and password.';
      $('loginError').classList.remove('hidden');
    } finally {
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });
  $('logoutBtn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    if (!user) {
      $('app').classList.add('hidden');
      $('login').classList.remove('hidden');
      $('password').value = '';
      return;
    }
    $('who').textContent = 'Signed in as ' + user.email;
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('error').classList.add('hidden');
    unsubscribe = onValue(ref(db, 'bookings'), (snap) => {
      const val = snap.val() || {};
      bookings = Object.keys(val).map((id) => Object.assign({ id: id }, val[id]));
      render();
    }, () => {
      $('error').textContent = 'Could not load bookings. This account may not be allowed to view them. Check the database rules.';
      $('error').classList.remove('hidden');
    });
  });

  /* ---------- Helpers ---------- */
  function today() { return new Date().toLocaleDateString('en-CA'); }

  function waLink(b) {
    let p = String(b.phone || '').replace(/[^\d+]/g, '');
    if (p.startsWith('+')) p = p.slice(1);
    else if (p.startsWith('0')) p = '27' + p.slice(1);
    const when = b.date + ' at ' + b.time;
    const text = b.status === 'confirmed'
      ? 'Hi ' + b.name + ', your ' + b.service + ' booking at KAT’S GLAM STUDIO on ' + when + ' is confirmed. See you then!'
      : 'Hi ' + b.name + ', thanks for your booking request for ' + b.service + ' on ' + when + '. Please send the R100 deposit to confirm your slot.';
    return 'https://wa.me/' + p + '?text=' + encodeURIComponent(text);
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  /* ---------- Render ---------- */
  function render() {
    const q = $('search').value.trim().toLowerCase();
    const sorted = bookings.slice().sort((a, b) =>
      (a.date + ' ' + a.time).localeCompare(b.date + ' ' + b.time));

    const cancelled = bookings.filter(b => b.status === 'cancelled').length;
    $('sTotal').textContent = bookings.length - cancelled;
    $('sCancelled').textContent = cancelled;

    const matches = (b) => {
      if (filter === 'all') return true;
      if (filter === 'today') return b.date === today() && b.status !== 'cancelled';
      if (filter === 'upcoming') return b.date >= today() && b.status !== 'cancelled';
      return b.status === filter;
    };
    const rows = sorted.filter(b => matches(b) &&
      (!q || [b.name, b.phone, b.service].join(' ').toLowerCase().includes(q)));

    const tbody = $('rows');
    tbody.textContent = '';
    if (!rows.length) {
      const tr = el('tr'); const td = el('td', 'empty',
        bookings.length ? 'No bookings match this filter.' : 'No bookings yet. New requests from the website will appear here.');
      td.colSpan = 6; tr.appendChild(td); tbody.appendChild(tr);
      return;
    }
    rows.forEach((b) => tbody.appendChild(row(b)));
  }

  function row(b) {
    const tr = el('tr');
    tr.appendChild(el('td', null, b.name || ''));

    const phone = el('td');
    const a = el('a', null, b.phone || '');
    a.href = waLink(b); a.target = '_blank'; a.rel = 'noopener';
    a.title = 'Message on WhatsApp';
    phone.appendChild(a);
    tr.appendChild(phone);

    tr.appendChild(el('td', null, b.service || ''));
    tr.appendChild(el('td', null, (b.date || '') + ' at ' + (b.time || '')));
    tr.appendChild(el('td', 'status-' + b.status, b.status));

    const act = el('td');
    const box = el('div', 'acts');
    const done = b.status === 'cancelled';
    box.appendChild(btn('Confirm', done || b.status === 'confirmed', () => setStatus(b.id, 'confirmed')));
    box.appendChild(btn('Cancel', done, () => setStatus(b.id, 'cancelled')));
    act.appendChild(box);
    tr.appendChild(act);
    return tr;
  }

  function btn(label, disabled, fn) {
    const b = el('button', 'act', label);
    b.type = 'button';
    b.disabled = disabled;
    b.addEventListener('click', fn);
    return b;
  }

  async function setStatus(id, status) {
    try { await update(ref(db, 'bookings/' + id), { status: status }); }
    catch (e) { $('error').textContent = 'Could not update this booking. Try again.'; $('error').classList.remove('hidden'); }
  }

  $('tabs').addEventListener('click', (e) => {
    const t = e.target.closest('.tab');
    if (!t) return;
    filter = t.dataset.f;
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', x === t ? 'true' : 'false'));
    render();
  });
  $('search').addEventListener('input', render);
</script>
</body>
</html>
